name: macOS checks

'on': [push, pull_request]

permissions:
  contents: read

jobs:
  checks:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check presence and replay logic
        run: swift run --jobs 1 --scratch-path /tmp/presencelock-checks PresenceLockCoreChecks
      - name: Build and verify the macOS archive
        run: ./scripts/build-app.sh
